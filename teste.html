<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulado Enfermagem 500+</title>
    <style>
        :root {
            --primary: #006064;
            --accent: #00acc1;
            --success: #2e7d32;
            --error: #c62828;
            --bg: #eceff1;
            --text: #37474f;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            background: white;
            max-width: 800px;
            width: 100%;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .header {
            text-align: center;
            border-bottom: 3px solid var(--primary);
            margin-bottom: 20px;
            padding-bottom: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border-bottom: 4px solid #cfd8dc;
        }

        .stat-value {
            font-size: 1.4rem;
            font-weight: bold;
            display: block;
        }

        .btn-main {
            width: 100%;
            padding: 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-main:hover {
            background: var(--accent);
        }

        #quiz-area {
            display: none;
        }

        .pergunta-texto {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #263238;
        }

        .opcao {
            width: 100%;
            padding: 15px;
            margin: 8px 0;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: white;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .opcao:hover:not(:disabled) {
            border-color: var(--accent);
            background: #f0fbfc;
        }

        .correta {
            background: #c8e6c9 !important;
            border-color: var(--success) !important;
            color: #1b5e20;
            font-weight: bold;
        }

        .errada {
            background: #ffcdd2 !important;
            border-color: var(--error) !important;
            color: #b71c1c;
        }

        #feedback {
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
            background: #fff3e0;
            border-left: 6px solid #ff9800;
            display: none;
        }

        .btn-next {
            width: 100%;
            padding: 15px;
            background: var(--text);
            color: white;
            border: none;
            margin-top: 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">
        <div id="home">
            <div class="header">
                <h1>Enfermagem Master Quiz</h1>
                <p>Simulado com questões de concursos reais para minha esposa Ju Roza</p>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <span>Progresso</span>
                    <span id="stat-progresso" class="stat-value">0/0</span>
                </div>
                <div class="stat-card">
                    <span>Acertos</span>
                    <span id="stat-acertos" class="stat-value" style="color:var(--success)">0%</span>
                </div>
                <div class="stat-card">
                    <span>Erros</span>
                    <span id="stat-erros" class="stat-value" style="color:var(--error)">0%</span>
                </div>
            </div>

            <button class="btn-main" onclick="iniciar()">INICIAR SIMULADO</button>
        </div>

        <div id="quiz-area">
            <div style="display:flex; justify-content: space-between; align-items: center;">
                <span id="num-questao" style="font-weight: bold; color: var(--primary);">Questão 1</span>
                <span id="categoria"
                    style="font-size: 0.8rem; background: #eee; padding: 4px 8px; border-radius: 4px;">GERAL</span>
            </div>

            <div style="display:flex; justify-content: space-between; align-items: center;">
               
                <span id="categoria"
                    style="font-size: 0.8rem; background: #eee; padding: 4px 8px; border-radius: 4px;"><a href="teste.html">INICIO</a></span>
            </div>
            <p id="pergunta" class="pergunta-texto"></p>
            <div id="opcoes"></div>

            <div id="feedback">
                <strong id="status-msg"></strong>
                <p id="explicacao" style="margin: 10px 0; font-style: italic;"></p>
                <button class="btn-next" onclick="proxima()">PRÓXIMA QUESTÃO »</button>
            </div>
        </div>
    </div>

    <script>
        // BANCO DE DADOS (EXPANSÍVEL)
        const banco = [
            // --- LOTE 04: IDOSO, MENTAL E FARMACO (QUESTÕES 161-260) ---
            { p: "Qual a escala utilizada para avaliar o risco de úlcera por pressão (Lesão por Pressão)?", o: ["Escala de Glasgow", "Escala de Braden", "Escala de Morse", "Escala de Apgar"], c: 1, e: "A Escala de Braden avalia percepção sensorial, umidade, atividade, mobilidade, nutrição e fricção." },
            { p: "O Estatuto do Idoso considera pessoa idosa aquela com idade igual ou superior a:", o: ["60 anos", "65 anos", "70 anos", "80 anos"], c: 0, e: "No Brasil, a Terceira Idade começa legalmente aos 60 anos." },
            { p: "O principal sinal clínico do Mal de Alzheimer em estágio inicial é:", o: ["Perda de memória recente", "Incontinência fecal", "Paralisia de membros", "Cegueira"], c: 0, e: "O esquecimento de fatos recentes é o marcador clássico da doença." },
            { p: "A 'Polifarmácia' no idoso é definida como o uso de:", o: ["2 ou mais medicamentos", "5 ou mais medicamentos", "Apenas 1 medicamento", "Medicamentos injetáveis"], c: 1, e: "O uso simultâneo de 5 ou mais fármacos aumenta o risco de interações adversas no idoso." },
            { p: "Qual o cuidado de enfermagem imediato em uma crise convulsiva?", o: ["Colocar um objeto na boca", "Segurar os braços da vítima", "Proteger a cabeça e afastar objetos próximos", "Fazer respiração boca a boca"], c: 2, e: "Deve-se evitar traumas secundários e manter as vias aéreas livres." },
            { p: "O lítio é um medicamento utilizado principalmente para tratar:", o: ["Hipertensão", "Transtorno Bipolar", "Infecção urinária", "Diabetes"], c: 1, e: "O carbonato de lítio é um estabilizador de humor padrão-ouro." },
            { p: "A contenção mecânica de pacientes psiquiátricos deve ser:", o: ["Feita apenas por um profissional", "O último recurso e sob supervisão direta", "Proibida em qualquer hipótese", "Feita com correntes metálicas"], c: 1, e: "É uma medida excepcional que exige prescrição e monitoramento rigoroso." },
            { p: "O que caracteriza o 'Delirium' no idoso?", o: ["Confusão mental aguda e flutuante", "Perda crônica de memória", "Aumento da inteligência", "Melhora do sono"], c: 0, e: "Diferente da demência, o delirium é agudo e geralmente reversível se tratada a causa." },
            { p: "A via de administração que possui a absorção mais rápida é:", o: ["Oral", "Intramuscular", "Endovenosa", "Subcutânea"], c: 2, e: "A via EV lança o fármaco diretamente na corrente sanguínea, sem passar por absorção." },
            { p: "Qual o efeito colateral comum do uso de diuréticos de alça (ex: Furosemida)?", o: ["Aumento do potássio", "Queda do potássio (Hipocalemia)", "Ganho de peso", "Constipação"], c: 1, e: "Diuréticos como a furosemida aumentam a excreção de potássio na urina." },
            { p: "O termo 'Inapetência' significa:", o: ["Falta de apetite", "Dificuldade de andar", "Excesso de sono", "Vontade de comer tudo"], c: 0, e: "Sinônimo de anorexia ou falta de vontade de comer." },
            { p: "A Lei 10.216/2001 dispõe sobre a proteção e os direitos das pessoas com:", o: ["Câncer", "Transtornos Mentais", "Deficiência visual", "AIDS"], c: 1, e: "É a Lei da Reforma Psiquiátrica brasileira." },
            { p: "Qual o antipsicótico típico muito utilizado em emergências psiquiátricas?", o: ["Haloperidol (Haldol)", "Dipirona", "Amoxicilina", "Losartana"], c: 0, e: "O Haldol é amplamente usado para controle de agitação psicomotora." },
            { p: "O exame que avalia o estado cognitivo rápido de um idoso é o:", o: ["Mini Exame do Estado Mental (MEEM)", "Eletrocardiograma", "Raio-X de tórax", "Hemograma"], c: 0, e: "O MEEM avalia orientação, memória, atenção e linguagem." },
            { p: "A 'Janela Terapêutica' é:", o: ["O intervalo entre a dose eficaz e a dose tóxica", "O tempo que o remédio leva para fazer efeito", "A hora que o paciente acorda", "A validade do medicamento"], c: 0, e: "Quanto menor a janela, mais perigoso é o medicamento." },
            { p: "O que significa 'Idoso Frágil'?", o: ["Idoso que faz academia", "Idoso com alta reserva funcional", "Idoso com vulnerabilidade a desfechos adversos (quedas, hospitalização)", "Qualquer pessoa com mais de 60 anos"], c: 2, e: "Fragilidade envolve perda de peso, exaustão e baixa atividade física." },
            { p: "A via Sublingual é vantajosa pois:", o: ["Evita o metabolismo de primeira passagem pelo fígado", "É mais barata", "Dura 24 horas no corpo", "Pode ser usada com o paciente vomitando"], c: 0, e: "A absorção pela mucosa bucal vai direto para a circulação sistêmica." },
            { p: "Qual a principal causa de quedas em idosos no domicílio?", o: ["Tapetes soltos e iluminação precária", "Excesso de comida", "Uso de sapatos ortopédicos", "Falta de televisão"], c: 0, e: "Fatores ambientais são os maiores responsáveis por acidentes domésticos." },
            { p: "O 'Zolpidem' é um fármaco indicado para:", o: ["Tratamento de Insônia", "Combate a infecções", "Controle da Pressão", "Alívio de azia"], c: 0, e: "É um hipnótico não-benzodiazepínico de curta duração." },
            { p: "O que é 'Ataxia'?", o: ["Falta de coordenação dos movimentos musculares", "Perda total da visão", "Aumento da temperatura", "Dificuldade de urinar"], c: 0, e: "Comum em doenças neurológicas ou intoxicações." },
            { p: "A técnica de 'Z-track' na injeção IM serve para:", o: ["Dizer onde aplicar", "Evitar o refluxo do medicamento para o tecido subcutâneo", "Aumentar a dor", "Diminuir a velocidade da aplicação"], c: 1, e: "Veda o trajeto da agulha na musculatura (comumente usada para ferro)." },
            { p: "A 'Depressão Maior' no idoso pode ser confundida com:", o: ["Gripe", "Demência (Pseudodemência)", "Catarata", "Fraturas"], c: 1, e: "O idoso deprimido pode apresentar déficit cognitivo similar à demência." },
            { p: "Qual o principal risco do uso de Benzodiazepínicos (ex: Diazepam) em idosos?", o: ["Aumento da memória", "Risco de quedas e sedação excessiva", "Cura da diabetes", "Melhora da visão"], c: 1, e: "Podem causar tontura, relaxamento muscular excessivo e confusão." },
            { p: "O termo 'Nistagmo' refere-se a:", o: ["Movimentos involuntários dos olhos", "Tremor nas mãos", "Ronco durante o sono", "Manchas na pele"], c: 0, e: "Movimentos oscilatórios e rítmicos do globo ocular." },
            { p: "A Enfermagem deve orientar o paciente que usa Alendronato (para osteoporose) a:", o: ["Deitar logo após tomar", "Tomar em jejum e permanecer em pé/sentado por 30 min", "Tomar com leite", "Tomar antes de dormir"], c: 1, e: "Evita irritação esofágica grave." },
            { p: "O que é 'Anedonia'?", o: ["Perda da capacidade de sentir prazer", "Excesso de felicidade", "Medo de lugares abertos", "Dificuldade de ler"], c: 0, e: "Sintoma central da depressão." },
            { p: "A 'Vitamina B12' é essencial para:", o: ["Visão noturna", "Sistema nervoso e formação de hemácias", "Saúde dos dentes", "Fortalecimento das unhas"], c: 1, e: "Sua falta causa anemia perniciosa e danos neurológicos." },
            { p: "Qual o local de aplicação da Insulina para absorção mais lenta?", o: ["Abdome", "Coxa", "Braço", "Glúteo"], c: 1, e: "O abdome é a mais rápida; a coxa e glúteo são mais lentas." },
            { p: "O que caracteriza a 'Esquizofrenia'?", o: ["Apenas tristeza", "Distorções do pensamento, percepção (alucinações) e afeto", "Esquecimento de nomes", "Aumento da pressão arterial"], c: 1, e: "É um transtorno psicótico crônico." },
            { p: "A 'Tolerância' a uma droga ocorre quando:", o: ["O corpo precisa de doses maiores para o mesmo efeito", "O paciente para de tomar", "O efeito fica muito forte com pouca dose", "A droga estraga"], c: 0, e: "Adaptação do organismo ao uso contínuo da substância." },
            { p: "Qual o cuidado ao administrar Vancomicina EV?", o: ["Aplicar rápido (em bolus)", "Infusão lenta para evitar a 'Síndrome do Homem Vermelho'", "Não precisa diluir", "Aplicar apenas no glúteo"], c: 1, e: "A infusão rápida libera histamina e causa rubor e queda de pressão." },
            { p: "O que é 'Ginecomastia'?", o: ["Aumento das mamas em homens", "Crescimento de pelos em mulheres", "Inflamação da gengiva", "Dor nas articulações"], c: 0, e: "Pode ser efeito colateral de alguns medicamentos ou desequilíbrio hormonal." },
            { p: "O 'CAPS' significa:", o: ["Centro de Apoio para Sangue", "Centro de Atenção Psicossocial", "Conselho de Assistência para Surdos", "Clínica de Atendimento Primário à Saúde"], c: 1, e: "Equipamento estratégico da Rede de Atenção Psicossocial (RAPS)." },
            { p: "A 'Farmacocinética' estuda:", o: ["O que o corpo faz com o fármaco", "O que o fármaco faz com o corpo", "O preço dos remédios", "A cor das pílulas"], c: 0, e: "Envolve absorção, distribuição, metabolismo e excreção." },
            { p: "Qual vitamina é produzida na pele através da exposição solar?", o: ["Vitamina A", "Vitamina C", "Vitamina D", "Vitamina E"], c: 2, e: "A radiação UV ativa a síntese de vitamina D." },
            { p: "O 'Glaucoma' é uma doença caracterizada por:", o: ["Aumento da pressão intraocular", "Opacidade do cristalino", "Infecção na retina", "Perda de cílios"], c: 0, e: "Pode levar à cegueira se não tratado." },
            { p: "O termo 'Lipodistrofia' na aplicação de insulina refere-se a:", o: ["Melhora da pele", "Alterações no tecido adiposo por falta de rodízio", "Aumento da fome", "Infecção no local"], c: 1, e: "Gera nódulos que prejudicam a absorção da insulina." },
            { p: "A 'Amoxicilina' pertence a qual classe?", o: ["Antifúngico", "Antiviral", "Antibiótico (Penicilina)", "Analgésico"], c: 2, e: "Usada para infecções bacterianas." },
            { p: "O que é 'Presbiacusia'?", o: ["Perda auditiva relacionada ao envelhecimento", "Visão cansada", "Dificuldade de sentir cheiro", "Tremor"], c: 0, e: "Degeneração natural da audição no idoso." },
            { p: "Qual o principal sintoma do Infarto Agudo do Miocárdio em idosos?", o: ["Sempre dor forte no peito", "Pode ser atípico (falta de ar ou mal-estar sem dor)", "Apenas dor no pé", "Febre alta"], c: 1, e: "Idosos e diabéticos frequentemente têm infartos 'silenciosos' ou atípicos." },
            { p: "A 'Digoxina' é usada para tratar:", o: ["Insuficiência Cardíaca", "Gripe", "Dor de dente", "Fraturas"], c: 0, e: "É um cardiotônico que aumenta a força de contração do coração." },
            { p: "O sinal de intoxicação digitálica (pela Digoxina) inclui:", o: ["Visão amarelada/esverdeada e náuseas", "Aumento do apetite", "Crescimento de unhas", "Melhora da audição"], c: 0, e: "Xantopsia é um sinal clássico de toxicidade." },
            { p: "O que é 'Sarcopenia'?", o: ["Perda de massa e força muscular no idoso", "Aumento da gordura abdominal", "Doença dos ossos de vidro", "Perda de dentes"], c: 0, e: "Contribui para a fragilidade e perda de autonomia." },
            { p: "A 'Catarata' é:", o: ["Aumento da pressão do olho", "Opacificação do cristalino", "Rasgo na retina", "Inflamação da pálpebra"], c: 1, e: "Causa visão embaçada e pode ser corrigida com cirurgia." },
            { p: "O 'Warfarin' (Marevan) é um:", o: ["Anticoagulante oral", "Anti-inflamatório", "Vitamina", "Antibiótico"], c: 0, e: "Exige controle rigoroso do tempo de protrombina (TAP/INR)." },
            { p: "O que significa 'Prandial'?", o: ["Relacionado à refeição", "Relacionado ao sono", "Relacionado ao exercício", "Relacionado ao banho"], c: 0, e: "Ex: Insulina prandial é a tomada junto à comida." },
            { p: "A 'Amnésia Retrógada' é:", o: ["Esquecer fatos antes do trauma", "Esquecer fatos novos", "Nunca esquecer nada", "Lembrar do futuro"], c: 0, e: "Perda de memórias já consolidadas." },
            { p: "O 'Espironolactona' é um diurético:", o: ["Poupador de potássio", "Que joga potássio fora", "Para emagrecer", "Que aumenta o açúcar"], c: 0, e: "Age nos túbulos renais poupando o potássio da excreção." },
            { p: "O que é 'Iatrogenia'?", o: ["Dano causado pelo tratamento médico/equipe de saúde", "Cura milagrosa", "Doença genética", "Falta de hospitais"], c: 0, e: "Pode ser por erro, excesso de medicamentos ou procedimentos." },
            { p: "A 'Escala de Depressão Geriátrica (GDS)' é usada para:", o: ["Medir a pressão do idoso", "Rastrear sintomas depressivos em idosos", "Verificar se o idoso ouve bem", "Contar quantos remédios ele toma"], c: 1, e: "Ferramenta de rastreio de humor na geriatria." },
            { p: "O que significa a sigla 'CME' no ambiente hospitalar?", o: ["Centro de Medicina Especializada", "Central de Material e Esterilização", "Controle de Medicamentos Estratégicos", "Conselho Médico de Emergência"], c: 1, e: "A CME é o setor responsável pelo reprocessamento de artigos médico-hospitalares." },
            { p: "Qual o indicador biológico utilizado para testar a eficácia da autoclave?", o: ["Bacillus atrophaeus", "Geobacillus stearothermophilus", "Escherichia coli", "Staphylococcus aureus"], c: 1, e: "O Geobacillus stearothermophilus é o microrganismo padrão para calor úmido por ser termofílico." },
            { p: "A cirurgia realizada para fins de diagnóstico (ex: biópsia) é classificada como:", o: ["Curativa", "Paliativa", "Diagnóstica ou Exploratória", "Reparadora"], c: 2, e: "Cirurgias diagnósticas visam confirmar a presença ou extensão de uma patologia." },
            { p: "Na escala de classificação de cirurgias quanto ao potencial de contaminação, uma cirurgia em tecidos colonizados por flora microbiana pouco numerosa é considerada:", o: ["Limpa", "Potencialmente Contaminada", "Contaminada", "Infectada"], c: 1, e: "Cirurgias em sistemas respiratório, digestório ou urinário sem inflamação são potencialmente contaminadas." },
            { p: "O que é o 'Checklist de Cirurgia Segura' da OMS?", o: ["Uma lista de compras para o hospital", "Uma ferramenta para reduzir erros e eventos adversos no centro cirúrgico", "Um guia de exercícios pós-operatórios", "Um formulário de alta médica"], c: 1, e: "O checklist foca em momentos críticos: antes da anestesia, antes da incisão e antes do paciente sair da sala." },
            { p: "Qual a função do instrumentador cirúrgico?", o: ["Anestesiar o paciente", "Fornecer os instrumentos ao cirurgião de forma ordenada e asséptica", "Limpar a sala após a cirurgia", "Realizar a cirurgia sozinho"], c: 1, e: "O instrumentador antecipa as necessidades do cirurgião e zela pela técnica asséptica." },
            { p: "O que caracteriza a 'Posição de Fowler'?", o: ["Paciente deitado com a cabeça mais baixa que os pés", "Cabeceira elevada entre 45 e 60 graus", "Deitado de bruços", "Deitado de lado"], c: 1, e: "Muito utilizada para melhorar a expansão pulmonar e conforto pós-operatório." },
            { p: "A esterilização por 'Calor Seco' é realizada em qual equipamento?", o: ["Autoclave", "Estufa", "Micro-ondas", "Lavadora ultrassônica"], c: 1, e: "A estufa utiliza altas temperaturas por tempo prolongado, sendo menos eficiente que a autoclave." },
            { p: "Um artigo 'Crítico' é aquele que:", o: ["Entra em contato com pele íntegra", "Entra em contato com tecidos estéreis ou sistema vascular", "Entra em contato com mucosas", "Não entra em contato com o paciente"], c: 1, e: "Artigos críticos (ex: bisturis) exigem obrigatoriamente esterilização." },
            { p: "O tempo de jejum pré-operatório padrão para líquidos claros é de geralmente:", o: ["2 horas", "8 horas", "12 horas", "24 horas"], c: 0, e: "Protocolos modernos (como o ACERTO) permitem líquidos claros até 2h antes da cirurgia." },
            { p: "O que é 'Sutura'?", o: ["O ato de cortar o tecido", "A união de bordas de uma ferida para facilitar a cicatrização", "A aplicação de gesso", "A drenagem de um abscesso"], c: 1, e: "Sutura é o fechamento de planos anatômicos com fios cirúrgicos." },
            { p: "A área do Centro Cirúrgico onde é obrigatório o uso de máscara, propé e gorro é a:", o: ["Área Restrita", "Área Não Restrita", "Área Semicrítica", "Recepção"], c: 0, e: "A área restrita inclui salas de cirurgia e corredores internos." },
            { p: "O que é 'Hemorragia'?", o: ["Aumento da pressão", "Perda excessiva de sangue", "Falta de ar", "Febre"], c: 1, e: "Pode ser interna ou externa e exige intervenção rápida." },
            { p: "A 'Anestesia Raquidiana' é administrada em qual local?", o: ["Veia do braço", "Espaço subaracnóideo (coluna)", "Músculo glúteo", "Inalação por máscara"], c: 1, e: "O anestésico é injetado no líquido cefalorraquidiano." },
            { p: "O termo 'Pós-operatório imediato' compreende qual período?", o: ["As primeiras 24 horas após a cirurgia", "A primeira semana", "O primeiro mês", "Apenas a hora da cirurgia"], c: 0, e: "É o período crítico de recuperação da anestesia e estabilização." },
            { p: "O que significa 'Deiscência de Sutura'?", o: ["Cicatrização perfeita", "Abertura espontânea das bordas de uma ferida suturada", "Inflamação por fios", "Retirada de pontos"], c: 1, e: "É uma complicação pós-operatória que pode levar à evisceração." },
            { p: "Qual o objetivo da lavagem das mãos cirúrgica (Degermação)?", o: ["Remover apenas a sujeira visível", "Eliminar a microbiota transitória e reduzir a residente", "Substituir o uso de luvas", "Hidratar a pele"], c: 1, e: "Dura entre 3 a 5 minutos com antisséptico escovando mãos e antebraços." },
            { p: "O dreno de 'Penrose' funciona por qual mecanismo?", o: ["Sucção a vácuo", "Capilaridade e gravidade", "Pressão positiva", "Bomba elétrica"], c: 1, e: "É um dreno aberto de látex muito comum em cirurgias abdominais." },
            { p: "A temperatura ideal de uma sala de cirurgia deve ser mantida entre:", o: ["15°C a 18°C", "18°C a 23°C", "25°C a 30°C", "35°C a 37°C"], c: 1, e: "Visa o conforto da equipe e a redução do crescimento bacteriano, sem causar hipotermia no paciente." },
            { p: "O que é 'Evisceração'?", o: ["Saída de órgãos internos através de uma abertura na parede abdominal", "Um tipo de curativo", "Retirada da vesícula", "Inflamação da pele"], c: 0, e: "É uma emergência cirúrgica grave." },
            { p: "Qual o gás utilizado para esterilização de materiais sensíveis ao calor?", o: ["Oxigênio", "Nitrogênio", "Óxido de Etileno", "Dióxido de Carbono"], c: 2, e: "O ETO é altamente eficaz, mas exige aeração por ser tóxico." },
            { p: "O que significa 'Time Out' no centro cirúrgico?", o: ["Hora do lanche da equipe", "Pausa imediatamente antes da incisão para confirmação de dados", "Fim do expediente", "Atraso na cirurgia"], c: 1, e: "Confirma-se paciente, local cirúrgico, procedimento e equipamentos." },
            { p: "A lavagem ultrassônica de materiais visa:", o: ["Esterilizar os objetos", "Remover sujidades em locais de difícil acesso por cavitação", "Secar o material", "Substituir a autoclave"], c: 1, e: "É uma etapa da limpeza automatizada na CME." },
            { p: "O que é 'Hipoxia' no pós-operatório?", o: ["Aumento do açúcar", "Baixa saturação de oxigênio no sangue", "Aumento da temperatura", "Queda da pressão"], c: 1, e: "Pode ser causada por deprimissão respiratória anestésica." },
            { p: "Qual a função do avental cirúrgico estéril?", o: ["Apenas identificar a equipe", "Barreira contra microrganismos e fluidos entre equipe e campo", "Esquentar o profissional", "Substituir a roupa privativa"], c: 1, e: "Mantém a esterilidade do campo operatório." },
            { p: "A 'Escala de Aldrete e Kroulik' serve para:", o: ["Medir a dor", "Avaliar a prontidão do paciente para alta da recuperação pós-anestésica", "Verificar o risco de queda", "Classificar o tipo de cirurgia"], c: 1, e: "Avalia consciência, respiração, circulação e atividade motora." },
            { p: "Um curativo 'Oclusivo' é aquele que:", o: ["Fica aberto ao ar", "Cobre totalmente a ferida sem permitir entrada de ar/contaminantes", "Usa apenas álcool", "É feito apenas com gaze solta"], c: 1, e: "Protege a ferida e mantém a umidade ideal." },
            { p: "O que significa a terminologia cirúrgica com sufixo '-tomia'?", o: ["Retirada de um órgão", "Abertura ou incisão em um órgão", "Fixação de um órgão", "Sutura de um órgão"], c: 1, e: "Ex: Laparotomia (abertura do abdome)." },
            { p: "A retirada da vesícula biliar chama-se:", o: ["Gastrectomia", "Colecistectomia", "Histerectomia", "Esplenectomia"], c: 1, e: "Colecisto = vesícula; ectomia = retirada." },
            { p: "O que é 'Isquemia'?", o: ["Aumento do fluxo sanguíneo", "Deficiência de suprimento sanguíneo para um tecido", "Sangramento ativo", "Infecção generalizada"], c: 1, e: "Pode causar morte tecidual (necrose) se prolongada." },
            { p: "Qual o principal risco do uso de eletrocautério (bisturi elétrico)?", o: ["Queimaduras e interferência em marca-passos", "Falta de corte", "Choque no cirurgião", "O barulho"], c: 0, e: "Exige o uso correto da placa dispersiva no paciente." },
            { p: "O que significa 'Jejuar'?", o: ["Comer apenas pão", "Abstenção total de ingestão de alimentos e líquidos", "Beber apenas água", "Comer frutas"], c: 1, e: "Essencial para evitar broncoaspiração durante a anestesia." },
            { p: "A 'Parada Cardiorrespiratória' em cirurgia deve ser tratada com:", o: ["Apenas massagem", "Protocolo de ACLS (Suporte Avançado de Vida)", "Apenas ventilação", "Esperar o paciente acordar"], c: 1, e: "Exige equipe treinada e carrinho de emergência pronto." },
            { p: "O que é 'Síncope'?", o: ["Dor de cabeça", "Desmaio ou perda súbita de consciência", "Aumento dos batimentos", "Convulsão"], c: 1, e: "Causada por diminuição transitória do fluxo sanguíneo cerebral." },
            { p: "A posição 'Trendelenburg Reverso' é usada para:", o: ["Drenar secreções do pulmão", "Cirurgias de cabeça e pescoço", "Aumentar a pressão nas pernas", "Parto normal"], c: 1, e: "O corpo fica inclinado com a cabeça mais alta que os pés." },
            { p: "Qual a cor do recipiente para descarte de resíduos infectantes (biológicos)?", o: ["Azul", "Branco leitoso", "Vermelho", "Preto"], c: 1, e: "Sacos brancos identificados com o símbolo de risco biológico." },
            { p: "O que significa '-stomia' na cirurgia?", o: ["Retirada", "Criação de uma abertura para o exterior (comunicação)", "Inflamação", "Corte"], c: 1, e: "Ex: Colostomia, Traqueostomia." },
            { p: "A 'Analgesia' visa:", o: ["Fazer o paciente dormir", "Retirar ou diminuir a dor sem perda total da consciência", "Paralisar os músculos", "Aumentar a pressão"], c: 1, e: "Diferente da anestesia geral, o foco é o controle da dor." },
            { p: "O que é 'Cianose'?", o: ["Pele amarelada", "Coloração azulada da pele por falta de oxigênio", "Pele muito vermelha", "Pele com manchas brancas"], c: 1, e: "Sinal importante de insuficiência respiratória." },
            { p: "Qual o antisséptico mais usado para preparo da pele com álcool?", o: ["Clorexidina alcoólica", "Água oxigenada", "Soro fisiológico", "Éter"], c: 0, e: "A clorexidina tem excelente efeito residual." },
            { p: "O 'Termo de Consentimento Livre e Esclarecido' deve ser assinado:", o: ["Após a cirurgia", "Antes da cirurgia, após explicação médica", "Apenas por crianças", "Apenas se o paciente quiser"], c: 1, e: "Documento legal indispensável que autoriza o procedimento." },
            { p: "O que é 'Enfisema Subcutâneo'?", o: ["Ar sob a pele que gera crepitação ao toque", "Água no pulmão", "Infecção na derme", "Gordura no sangue"], c: 0, e: "Pode ocorrer após traumas torácicos ou laparoscopia." },
            { p: "A monitorização básica na sala de cirurgia inclui:", o: ["Apenas o peso", "ECG, Oximetria, Pressão Arterial e Temperatura", "Apenas a cor da pele", "Teste de QI"], c: 1, e: "Sinais vitais essenciais para a segurança anestésica." },
            { p: "O que é 'Trombose Venosa Profunda' (TVP)?", o: ["Sangramento na veia", "Formação de coágulo em veias profundas, geralmente pernas", "Aumento da veia", "Veia que sumiu"], c: 1, e: "Complicação temida no pós-operatório por risco de embolia pulmonar." },
            { p: "Para evitar TVP no pós-operatório, recomenda-se:", o: ["Ficar imóvel por 3 dias", "Deambulação precoce e uso de meias elásticas", "Comer muito sal", "Não beber água"], c: 1, e: "O movimento ajuda no retorno venoso." },
            { p: "O que é 'Atelectasia'?", o: ["Colapso de parte dos alvéolos pulmonares", "Coração aumentado", "Rim parado", "Fígado inflamado"], c: 0, e: "Causa comum de febre nas primeiras 24-48h pós-cirurgia." },
            { p: "Qual a função do dreno de 'Portovac'?", o: ["Drenar urina", "Drenagem por sucção a vácuo de fluidos cirúrgicos", "Alimentar o paciente", "Injetar remédio"], c: 1, e: "Sistema fechado muito usado em cirurgias ortopédicas e plásticas." },
            { p: "O que caracteriza a 'Anestesia Geral'?", o: ["Paciente acordado", "Inconsciência, analgesia, amnésia e relaxamento muscular", "Apenas perda de sensibilidade no braço", "Dor intensa"], c: 1, e: "Envolve a perda total da consciência e reflexos." },
            { p: "A 'Paracentese' é o procedimento para retirar líquido do:", o: ["Pulmão", "Abdome (ascite)", "Cérebro", "Coração"], c: 1, e: "Punção da cavidade abdominal." },
            { p: "O que é 'Bradicardia'?", o: ["Pulso rápido", "Pulso lento (abaixo de 60 bpm no adulto)", "Pulso ausente", "Pressão alta"], c: 1, e: "Pode ser efeito de anestésicos ou problemas cardíacos." },
            { p: "Para administrar 1000ml de SF 0,9% em 24h, qual o gotejamento (gotas/min)?", o: ["7 gts/min", "14 gts/min", "21 gts/min", "28 gts/min"], c: 1, e: "Fórmula: V / (T*3). 1000 / (24*3) = 1000 / 72 = 13.8 (aprox. 14)." }
        ];

        let atual = 0;
        let acertos = 0;
        let respondidas = 0;

        function iniciar() {
            document.getElementById('home').style.display = 'none';
            document.getElementById('quiz-area').style.display = 'block';
            atualizarDashboard();
            carregarQuestao();
        }

        function carregarQuestao() {
            const q = banco[atual];
            document.getElementById('num-questao').innerText = `Questão ${atual + 1} de ${banco.length}`;
            document.getElementById('pergunta').innerText = q.p;
            document.getElementById('feedback').style.display = 'none';

            const areaOpcoes = document.getElementById('opcoes');
            areaOpcoes.innerHTML = '';

            q.o.forEach((texto, i) => {
                const btn = document.createElement('button');
                btn.className = 'opcao';
                btn.innerText = texto;
                btn.onclick = () => checar(i);
                areaOpcoes.appendChild(btn);
            });
        }

        function checar(escolha) {
            const q = banco[atual];
            const btns = document.querySelectorAll('.opcao');
            btns.forEach(b => b.disabled = true);

            respondidas++;
            if (escolha === q.c) {
                btns[escolha].classList.add('correta');
                acertos++;
                document.getElementById('status-msg').innerText = "✅ CORRETO!";
                document.getElementById('status-msg').style.color = "var(--success)";
            } else {
                btns[escolha].classList.add('errada');
                btns[q.c].classList.add('correta');
                document.getElementById('status-msg').innerText = "❌ INCORRETO.";
                document.getElementById('status-msg').style.color = "var(--error)";
            }

            document.getElementById('explicacao').innerText = q.e;
            document.getElementById('feedback').style.display = 'block';
            atualizarDashboard();
        }

        function proxima() {
            atual++;
            if (atual < banco.length) carregarQuestao();
            else {
                alert(`Fim do Simulado! Você acertou ${acertos} de ${banco.length}.`);
                location.reload();
            }
        }

        function atualizarDashboard() {
            document.getElementById('stat-progresso').innerText = `${respondidas}/${banco.length}`;
            if (respondidas > 0) {
                let perc = ((acertos / respondidas) * 100).toFixed(1);
                document.getElementById('stat-acertos').innerText = perc + "%";
                document.getElementById('stat-erros').innerText = (100 - perc).toFixed(1) + "%";
            }
        }
    </script>

</body>
