<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulado Universitário Pro - 50 Questões</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --success: #27ae60;
            --error: #e74c3c;
            --bg: #f4f7f6;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            background: white;
            max-width: 850px;
            width: 100%;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        /* Dashboard */
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            background: #ebf2f7;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid #d6e0e9;
            position: relative;
        }

        .stat-label {
            font-size: 0.85rem;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 800;
            display: block;
        }

        .text-success {
            color: var(--success);
        }

        .text-error {
            color: var(--error);
        }

        .btn-reset {
            grid-column: span 2;
            background: none;
            border: 1px solid #cbd5e1;
            color: #64748b;
            padding: 5px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.7rem;
            margin-top: 5px;
        }

        /* Menu */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }

        .btn-materia {
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: var(--primary);
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-materia:hover {
            background: var(--accent);
            transform: translateY(-2px);
        }

        /* Quiz Area */
        #quiz-area {
            display: none;
        }

        .progress-container {
            width: 100%;
            background: #eee;
            height: 10px;
            border-radius: 5px;
            margin: 20px 0;
            overflow: hidden;
        }

        #progress-bar {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: 0.4s;
        }

        .header-quiz {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: #7f8c8d;
            font-weight: bold;
        }

        .btn-voltar {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--primary);
            cursor: pointer;
            padding: 0 10px 0 0;
        }

        #pergunta-texto {
            font-size: 1.2rem;
            color: var(--primary);
            margin: 20px 0;
            line-height: 1.4;
            font-weight: 600;
        }

        .opcoes-grid {
            display: grid;
            gap: 10px;
        }

        .opcao {
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background: white;
            text-align: left;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
        }

        .correta {
            background: #d4edda !important;
            border-color: var(--success) !important;
        }

        .errada {
            background: #f8d7da !important;
            border-color: var(--error) !important;
        }

        #area-feedback {
            margin-top: 25px;
            padding: 20px;
            border-left: 5px solid var(--accent);
            background: #f1f8ff;
            display: none;
            border-radius: 0 8px 8px 0;
        }

        .btn-acao {
            width: 100%;
            margin-top: 15px;
            padding: 15px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="home">
            <h1 style="text-align: center; color: var(--primary);">Simulado Integrado</h1>

            <div class="dashboard">
                <div>
                    <span class="stat-label">Acertos</span>
                    <span id="perc-pos" class="stat-value text-success">0%</span>
                </div>
                <div>
                    <span class="stat-label">Erros</span>
                    <span id="perc-neg" class="stat-value text-error">0%</span>
                </div>
                <button class="btn-reset" onclick="resetStats()">Zerar Estatísticas de Desempenho</button>
            </div>

            <div class="menu-grid">
                <button class="btn-materia" onclick="start('micro')">Programação de Microcontroladores</button>
                <button class="btn-materia" onclick="start('calculo')">Cálculo Diferencial e Integral</button>
                <button class="btn-materia" onclick="start('embarcados')">Sistemas Embarcados</button>
                <button class="btn-materia" onclick="start('digital')">Eletrônica Digital</button>
                <button class="btn-materia" onclick="start('quant')">Métodos Quantitativos</button>
            </div>
        </div>

        <div id="quiz-area">
            <div class="header-quiz">
                <div style="display: flex; align-items: center;">
                    <button class="btn-voltar" onclick="location.reload()">←</button>
                    <span id="label-materia">MATÉRIA</span>
                </div>
                <span id="label-progresso">Questão 1 de 50</span>
            </div>
            <div class="progress-container">
                <div id="progress-bar"></div>
            </div>

            <div id="pergunta-texto"></div>
            <div id="opcoes" class="opcoes-grid"></div>

            <div id="area-feedback">
                <strong id="res-titulo"></strong>
                <p id="explicacao-corpo"></p>
                <button class="btn-acao" onclick="next()">Próxima Questão</button>
            </div>
        </div>
    </div>

        function updateStats() {
            let total = parseInt(localStorage.getItem('sim_total')) || 0;
            let hits = parseInt(localStorage.getItem('sim_hits')) || 0;
            if (total > 0) {
                let p = ((hits / total) * 100).toFixed(1);
                document.getElementById('perc-pos').innerText = p + "%";
                document.getElementById('perc-neg').innerText = (100 - p).toFixed(1) + "%";
            } else {
                document.getElementById('perc-pos').innerText = "0%";
                document.getElementById('perc-neg').innerText = "0%";
            }
        }

        function resetStats() {
            if (confirm("Deseja zerar seu histórico de desempenho?")) {
                localStorage.removeItem('sim_total');
                localStorage.removeItem('sim_hits');
                updateStats();
            }
        }

        function start(m) {
            curMat = m; curIdx = 0; curHit = 0;
            document.getElementById('home').style.display = 'none';
            document.getElementById('quiz-area').style.display = 'block';
            document.getElementById('label-materia').innerText = m.toUpperCase();
            render();
        }

        function render() {
            const q = bancoMaster[curMat][curIdx];
            document.getElementById('label-progresso').innerText = `Questão ${curIdx + 1} de ${bancoMaster[curMat].length}`;
            document.getElementById('progress-bar').style.width = `${(curIdx / bancoMaster[curMat].length) * 100}%`;
            document.getElementById('pergunta-texto').innerText = q.p;
            document.getElementById('area-feedback').style.display = 'none';

            const area = document.getElementById('opcoes');
            area.innerHTML = '';
            q.o.forEach((t, i) => {
                const b = document.createElement('button');
                b.className = 'opcao'; b.innerText = t;
                b.onclick = () => check(i);
                area.appendChild(b);
            });
        }

        function check(i) {
            const q = bancoMaster[curMat][curIdx];
            const btns = document.querySelectorAll('.opcao');
            btns.forEach(b => b.disabled = true);

            let total = parseInt(localStorage.getItem('sim_total')) || 0;
            let hits = parseInt(localStorage.getItem('sim_hits')) || 0;
            localStorage.setItem('sim_total', total + 1);

            if (i === q.c) {
                btns[i].classList.add('correta');
                curHit++;
                localStorage.setItem('sim_hits', hits + 1);
                document.getElementById('res-titulo').innerText = "✅ Correto!";
                document.getElementById('res-titulo').style.color = "var(--success)";
            } else {
                btns[i].classList.add('errada');
                btns[q.c].classList.add('correta');
                document.getElementById('res-titulo').innerText = "❌ Errou!";
                document.getElementById('res-titulo').style.color = "var(--error)";
            }
            document.getElementById('explicacao-corpo').innerHTML = `<strong>Explicação:</strong> ${q.e}`;
            document.getElementById('area-feedback').style.display = 'block';
            updateStats();
        }

        function next() {
            curIdx++;
            if (curIdx < bancoMaster[curMat].length) render();
            else {
                alert(`Fim da matéria! Acertos nesta sessão: ${curHit} de ${bancoMaster[curMat].length}`);
                location.reload();
            }
        }

        updateStats();
    </script>
</body>

</html>
